name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Build
        run: dotnet build AC_RoomDarkener.csproj -c Release -v minimal

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "bin\Release\net6.0\AC_RoomDarkener.dll" package\
          Copy-Item README.md package\
          Copy-Item CHANGELOG.md package\
          Compress-Archive -Path "package\*" -DestinationPath "AC_RoomDarkener-${{ github.ref_name }}.zip" -Force

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: AC_RoomDarkener-*.zip
          generate_release_notes: true
